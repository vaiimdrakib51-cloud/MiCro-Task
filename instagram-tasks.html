<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram Tasks — MicroTask</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: #0a010c; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px 10px; }
    .app-screen { width: 100%; max-width: 410px; background: radial-gradient(circle at 50% 20%, #40062b 0%, #1a0215 60%, #0a010c 100%); border: 2px solid #d62976; border-radius: 28px; padding: 18px 14px; box-shadow: 0 0 25px rgba(214, 41, 118, 0.35); display: flex; flex-direction: column; gap: 14px; min-height: 600px; }
    
    .header { display: flex; align-items: center; gap: 12px; }
    .back-btn { color: #f7a8c4; font-size: 16px; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: rgba(214, 41, 118, 0.15); border: 1px solid rgba(214, 41, 118, 0.35); display: flex; align-items: center; justify-content: center; }
    .logo-3d { width: 40px; height: 40px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; color: white; flex-shrink: 0; }
    .header-title h2 { color: #ffffff; font-size: 16px; font-weight: 700; }
    .header-title p { color: #fa7e1e; font-size: 10px; font-weight: 500; }
    
    .notice-bar { background: rgba(214, 41, 118, 0.15); border: 1px dashed #d62976; border-radius: 12px; padding: 8px 12px; font-size: 10.5px; color: #ffd1e1; display: flex; align-items: center; gap: 8px; }
    
    .task-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .task-card { background: linear-gradient(180deg, #330524 0%, #14020f 100%); border: 1.5px solid #cc2366; border-radius: 16px; padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
    .task-card.is-pending { border-color: #e69500 !important; }
    
    .task-thumb { width: 66px; height: 52px; border-radius: 10px; background: #4a0d37; border: 1px solid #d62976; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .play-circle { width: 20px; height: 20px; background: rgba(220, 39, 67, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 8.5px; }
    .timestamp { position: absolute; bottom: 2px; right: 3px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 8px; font-weight: 700; padding: 1px 3px; border-radius: 3px; }
    
    .task-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2.5px; }
    .task-name { color: #ffffff; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-reward { display: flex; align-items: center; gap: 5px; }
    .mini-usd-tag { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 6px; }
    .reward-amount { color: #34d399; font-size: 11.5px; font-weight: 850; }
    
    .task-tags { display: flex; gap: 3.5px; margin-top: 1px; }
    .tag { background: rgba(214, 41, 118, 0.2); border: 0.5px solid #d62976; color: #ffb3ce; font-size: 8px; padding: 1.5px 4.5px; border-radius: 4px; font-weight: 600; }
    
    .btn-3d { background: linear-gradient(180deg, #ff5b94 0%, #bc1888 100%); border: 1px solid #ff9ec3; color: white; font-size: 11px; font-weight: 700; padding: 6px 11px; border-radius: 14px; cursor: pointer; }
    .btn-pending { background: linear-gradient(180deg, #ffb300 0%, #e67e00 100%); border: 1px solid #ffe082; color: #fff; font-size: 9.5px; font-weight: 700; padding: 5px 8px; border-radius: 12px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 0, 10, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
    .modal-box { width: 100%; max-width: 390px; background: radial-gradient(circle at 50% 0%, #450830 0%, #1f0418 70%, #0a010c 100%); border: 1.5px solid #d62976; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 16px; color: #ff9ec3; font-size: 18px; cursor: pointer; }
    .modal-title { color: #fff; font-size: 15px; font-weight: 700; }
    .step-box { background: rgba(55, 6, 40, 0.5); border: 1px solid #a61c56; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .step-header { color: #ff8cb7; font-size: 10.5px; font-weight: 700; }
    
    .video-link-btn { display: flex; align-items: center; justify-content: center; gap: 7px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); color: white; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; }
    
    /* ১০০% গ্যারান্টিড গ্যালারি স্লট (ট্যাপ করলেই গ্যালারি খুলবে) */
    .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .upload-slot { border: 1.5px dashed #d62976; background: rgba(70, 10, 50, 0.3); border-radius: 10px; height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
    .upload-slot i { font-size: 18px; color: #ff5b94; margin-bottom: 3px; }
    .upload-slot span { color: #ffd6e4; font-size: 9.5px; font-weight: 600; text-align: center; }
    .slot-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 5; }
    
    /* স্বচ্ছ ইনপুট যা পুরো স্লটে সরাসরি গ্যালারি ওপেন করে */
    .slot-native-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
    
    .submit-btn { background: linear-gradient(180deg, #ff5b94 0%, #bc1888 100%); border: 1px solid #ffa1c4; color: white; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 18px; cursor: pointer; width: 100%; text-align: center; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='index.html'" title="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </div>
      <div class="logo-3d"><i class="fa-brands fa-instagram"></i></div>
      <div class="header-title"><h2>Instagram Tasks</h2><p>Watch Video • Like • Earn USD ($)</p></div>
    </div>
    
    <div class="notice-bar">
      <i class="fa-solid fa-circle-info"></i>
      <span>Tap slots to pick screenshots from your phone gallery.</span>
    </div>
    
    <div class="task-list" id="taskListContainer"></div>
  </div>

  <!-- প্রুফ সাবমিট মডাল -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <i class="fa-solid fa-xmark close-btn" onclick="closeModal()"></i>
      <h3 class="modal-title" id="m-title">Complete Task & Submit</h3>
      
      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-1"></i> Step 1: Open Instagram Video</div>
        <button type="button" class="video-link-btn" onclick="openTargetVideo()">
          <i class="fa-brands fa-instagram"></i> Open Video Link
        </button>
      </div>

      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-2"></i> Step 2: Select 3 Screenshots from Gallery</div>
        <div class="upload-grid">
          <!-- ১. লাইক স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-thumbs-up"></i><span>1. Like</span>
            <img id="prev-1" class="slot-preview">
            <input type="file" id="file-1" accept="image/*" class="slot-native-input" onchange="previewSlot(1, event)">
          </div>
          
          <!-- ২. ফলো স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-user-plus"></i><span>2. Follow</span>
            <img id="prev-2" class="slot-preview">
            <input type="file" id="file-2" accept="image/*" class="slot-native-input" onchange="previewSlot(2, event)">
          </div>
          
          <!-- ৩. কমেন্ট স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-comment-dots"></i><span>3. Comment</span>
            <img id="prev-3" class="slot-preview">
            <input type="file" id="file-3" accept="image/*" class="slot-native-input" onchange="previewSlot(3, event)">
          </div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitProof()">
        <i class="fa-solid fa-circle-check"></i> Submit for Admin Review
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrG81DRVjx040QhiT68yyRErGXjuCPdS4",
      authDomain: "micro-task-2906d.firebaseapp.com",
      projectId: "micro-task-2906d",
      storageBucket: "micro-task-2906d.firebasestorage.app",
      messagingSenderId: "642332420854",
      appId: "1:642332420854:web:67115930992e7685b49ad7",
      measurementId: "G-N76WH82XYJ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let activeTaskId = null;
    let activeTaskUrl = '';
    let activeRewardUSD = 0.20;
    let pendingTasks = new Set(JSON.parse(localStorage.getItem('ig_pending_tasks') || '[]'));

    const DEFAULT_IG_TASKS = [
      { id: 'ig-1', title: 'Viral Instagram Reel #1', rewardUSD: 0.25, duration: '0:30', url: 'https://instagram.com' },
      { id: 'ig-2', title: 'Fashion Brand Promo #2', rewardUSD: 0.20, duration: '0:45', url: 'https://instagram.com' }
    ];

    function listenToLiveTasks() {
      db.collection("tasks").where("platform", "==", "instagram").onSnapshot(snapshot => {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = '';

        if (snapshot.empty) {
          DEFAULT_IG_TASKS.forEach(t => renderSingleTaskCard(t.id, t.title, t.rewardUSD, t.duration, t.url));
        } else {
          snapshot.forEach(doc => {
            const data = doc.data();
            const reward = data.rewardUSD || (data.coins ? (data.coins / 100) : 0.20);
            renderSingleTaskCard(doc.id, data.title, reward, data.duration || '0:30', data.url || 'https://instagram.com');
          });
        }
      }, err => {
        DEFAULT_IG_TASKS.forEach(t => renderSingleTaskCard(t.id, t.title, t.rewardUSD, t.duration, t.url));
      });
    }

    function renderSingleTaskCard(id, title, rewardUSD, duration, url) {
      const container = document.getElementById('taskListContainer');
      const isPending = pendingTasks.has(id);

      const card = document.createElement('div');
      card.className = `task-card ${isPending ? 'is-pending' : ''}`;
      card.id = id;
      card.onclick = () => handleCardClick(id, title, rewardUSD, url);

      card.innerHTML = `
        <div class="task-thumb">
          <div class="play-circle"><i class="fa-solid fa-play"></i></div>
          <span class="timestamp">${duration}</span>
        </div>
        <div class="task-info">
          <span class="task-name">${title}</span>
          <div class="task-reward">
            <span class="mini-usd-tag">USD</span>
            <span class="reward-amount">+$${parseFloat(rewardUSD).toFixed(2)}</span>
          </div>
          <div class="task-tags">
            <span class="tag">Like</span>
            <span class="tag">Follow</span>
            <span class="tag">Comment</span>
          </div>
        </div>
        <div class="action-btn-area">
          ${isPending 
            ? '<div class="btn-pending"><i class="fa-solid fa-clock"></i> Pending</div>' 
            : '<button class="btn-3d"><i class="fa-solid fa-play"></i> Start</button>'}
        </div>
      `;

      container.appendChild(card);
    }

    function handleCardClick(id, title, rewardUSD, url) {
      if(pendingTasks.has(id)) { alert("This task is currently Pending Admin review!"); return; }
      activeTaskId = id;
      activeTaskUrl = url || 'https://instagram.com';
      activeRewardUSD = parseFloat(rewardUSD) || 0.20;

      document.getElementById('m-title').innerText = `${title} (+$${activeRewardUSD.toFixed(2)})`;
      
      for(let i=1; i<=3; i++){ 
        document.getElementById('file-'+i).value = ""; 
        document.getElementById('prev-'+i).style.display = "none"; 
      }
      document.getElementById('taskModal').style.display = "flex";
    }

    // ১০০% ক্র্যাশ-মুক্ত ইউনিভার্সাল লিঙ্ক ওপেনার
    function openTargetVideo() {
      if (!activeTaskUrl) return;
      // স্ট্যান্ডার্ড উইন্ডো ওপেন যা কোনো এরর দেয় না
      const win = window.open(activeTaskUrl, '_blank');
      if (!win) {
        window.location.href = activeTaskUrl;
      }
    }

    // গ্যালারি প্রিভিউ হ্যান্ডলার
    function previewSlot(num, e){
      if(e.target.files && e.target.files[0]){
        let r = new FileReader();
        r.onload = function(ev){ 
          document.getElementById('prev-'+num).src = ev.target.result; 
          document.getElementById('prev-'+num).style.display = "block"; 
        };
        r.readAsDataURL(e.target.files[0]);
      }
    }

    function closeModal(){ document.getElementById('taskModal').style.display="none"; }

    function submitProof(){
      if(!document.getElementById('file-1').files.length || !document.getElementById('file-2').files.length || !document.getElementById('file-3').files.length){
        alert("Please select all 3 screenshots from your gallery!"); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Submitting to Admin...";
      
      pendingTasks.add(activeTaskId);
      localStorage.setItem('ig_pending_tasks', JSON.stringify([...pendingTasks]));
      
      let card = document.getElementById(activeTaskId);
      if(card) {
        card.classList.add('is-pending');
        card.querySelector('.action-btn-area').innerHTML = '<div class="btn-pending"><i class="fa-solid fa-clock"></i> Pending</div>';
      }

      const cachedUser = JSON.parse(localStorage.getItem('microtask_cached_user')) || {};
      const userUID = String(cachedUser.uid || '000000').trim();

      db.collection("task_submissions").add({
        taskId: activeTaskId,
        platform: "instagram",
        uid: userUID,
        rewardUSD: activeRewardUSD,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Proof submitted successfully! It is now Pending review in the Admin Panel.");
        closeModal();
      }).catch(err => {
        alert("Submission error: " + err.message);
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Submit for Admin Review";
      });
    }

    document.addEventListener('DOMContentLoaded', listenToLiveTasks);
  </script>
</body>
</html>
