name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android App Project
        run: |
          mkdir -p app/src/main/java/com/microtask/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # Download App Icon
          curl -sL "https://i.ibb.co.com/5W2f2xg4/pngtree-money-icon-dollar-coins-cash-payment-online-earning-png-image-7589413.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          # Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # Settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MicroTask"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # App build.gradle (OneSignal + AndroidX Core)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.microtask.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.microtask.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.onesignal:OneSignal:[5.1.0, 5.99.99]'
          }
          EOF

          # Strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MicroTask</string>
          </resources>
          EOF

          # Themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.MicroTask" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0284c7</item>
              </style>
          </resources>
          EOF

          # AndroidManifest.xml (সকল প্রয়োজনীয় পারমিশন ও ব্যাকগ্রাউন্ড সার্ভিস যুক্ত)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- ইন্টারনেট ও নেটওয়ার্ক পারমিশন -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <!-- পুশ নোটিফিকেশন পারমিশন (Android 13+) -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <!-- গ্যালারি থেকে ছবি সিলেক্ট করার পারমিশন -->
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:name=".MyApplication"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MicroTask"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MyApplication.java (অ্যাপ বন্ধ থাকলেও ব্যাকগ্রাউন্ড নোটিফিকেশন চালু রাখবে)
          cat << 'EOF' > app/src/main/java/com/microtask/app/MyApplication.java
          package com.microtask.app;

          import android.app.Application;
          import com.onesignal.OneSignal;
          import com.onesignal.debug.LogLevel;

          public class MyApplication extends Application {
              private static final String ONESIGNAL_APP_ID = "e94dc542-7d17-4dd3-a20e-c1925cce7749";

              @Override
              public void onCreate() {
                  super.onCreate();
                  // ব্যাকগ্রাউন্ডে নোটিফিকেশন রিসিভ করার জন্য অ্যাপ্লিকেশন লেভেলে ইনিট
                  OneSignal.getDebug().setLogLevel(LogLevel.VERBOSE);
                  OneSignal.initWithContext(this, ONESIGNAL_APP_ID);
              }
          }
          EOF

          # MainActivity.java (পারমিশন রিকোয়েস্ট + গ্যালারি ফাইল পিকার + এক্সটার্নাল অ্যাপ রিডাইরেক্ট)
          cat << 'EOF' > app/src/main/java/com/microtask/app/MainActivity.java
          package com.microtask.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.onesignal.Continue;
          import com.onesignal.OneSignal;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private WebView myWebView;
              private ValueCallback<Uri[]> mFilePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
              private static final int PERMISSION_REQUEST_CODE = 2001;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // ১. অ্যাপে ঢোকার সাথে সাথে নোটিফিকেশন এবং গ্যালারির পারমিশন পপআপ
                  requestAppPermissions();

                  // OneSignal ইন-অ্যাপ প্রম্পট
                  OneSignal.getNotifications().requestPermission(true, Continue.none());

                  myWebView = new WebView(this);
                  setContentView(myWebView);

                  WebSettings webSettings = myWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);

                  // ২. বাহ্যিক লিংক হ্যান্ডলিং (ইউটিউব, টেলিগ্রাম, ফেসবুক সরাসরি তাদের অ্যাপে খুলবে)
                  myWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrls(request.getUrl().toString());
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrls(url);
                      }
                  });

                  // ৩. গ্যালারি থেকে স্ক্রিনশট সিলেক্ট করার জন্য WebChromeClient
                  myWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (mFilePathCallback != null) {
                              mFilePathCallback.onReceiveValue(null);
                          }
                          mFilePathCallback = filePathCallback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false);

                          try {
                              startActivityForResult(Intent.createChooser(intent, "Select Screenshot"), FILE_CHOOSER_REQUEST_CODE);
                          } catch (ActivityNotFoundException e) {
                              mFilePathCallback = null;
                              Toast.makeText(MainActivity.this, "No file manager found", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  myWebView.loadUrl("https://vaiimdrakib51-cloud.github.io/MiCro-Task/");
              }

              // অ্যাপ খোলার সাথে সাথে পারমিশন চাওয়া
              private void requestAppPermissions() {
                  List<String> list = new ArrayList<>();

                  // পুশ নোটিফিকেশন পারমিশন (Android 13+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          list.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          list.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          list.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }

                  if (!list.isEmpty()) {
                      ActivityCompat.requestPermissions(this, list.toArray(new String[0]), PERMISSION_REQUEST_CODE);
                  }
              }

              // লিংক হ্যান্ডলার: নিজস্ব ওয়েবসাইট ছাড়া বাইরের যেকোনো অ্যাপে রিডাইরেক্ট করবে
              private boolean handleExternalUrls(String url) {
                  if (url == null) return false;

                  // অ্যাপের নিজস্ব ওয়েবসাইট হলে ভেতরেই থাকবে
                  if (url.startsWith("https://vaiimdrakib51-cloud.github.io/MiCro-Task/")) {
                      return false;
                  }

                  try {
                      // intent:// বা সরাসরি t.me, whatsapp, youtube, facebook লিংক
                      Intent intent;
                      if (url.startsWith("intent:")) {
                          intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          if (intent != null) {
                              startActivity(intent);
                              return true;
                          }
                      } else {
                          intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                          return true;
                      }
                  } catch (Exception e) {
                      try {
                          // অ্যাপ ইনস্টল না থাকলে সাধারণ ব্রাউজারে খুলবে
                          Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(browserIntent);
                          return true;
                      } catch (Exception ex) {
                          Toast.makeText(this, "Cannot open this link", Toast.LENGTH_SHORT).show();
                      }
                  }
                  return true;
              }

              // গ্যালারি থেকে ছবি সিলেক্ট হওয়ার পর রিটার্ন রেজাল্ট হ্যান্ডলিং
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (mFilePathCallback == null) return;

                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getData() != null) {
                              results = new Uri[]{ data.getData() };
                          } else if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          }
                      }
                      mFilePathCallback.onReceiveValue(results);
                      mFilePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (myWebView.canGoBack()) {
                      myWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MicroTask-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
