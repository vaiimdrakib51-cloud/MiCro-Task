<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Tasks — MicroTask</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: #080000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px 10px; }
    .app-screen { width: 100%; max-width: 410px; background: radial-gradient(circle at 50% 20%, #4a0505 0%, #1a0202 60%, #080000 100%); border: 2px solid #ff1a1a; border-radius: 28px; padding: 18px 14px; box-shadow: 0 0 25px rgba(255, 26, 26, 0.35); display: flex; flex-direction: column; gap: 14px; min-height: 600px; }
    
    .header { display: flex; align-items: center; gap: 12px; }
    .back-btn { color: #ff9999; font-size: 16px; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 26, 26, 0.15); border: 1px solid rgba(255, 77, 77, 0.35); display: flex; align-items: center; justify-content: center; }
    .back-btn:active { transform: scale(0.9); }
    .logo-3d { width: 40px; height: 40px; background: linear-gradient(145deg, #ff3333, #b30000); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; color: white; box-shadow: 0 4px 10px rgba(255, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
    .header-title h2 { color: #ffffff; font-size: 16px; font-weight: 700; }
    .header-title p { color: #ff8080; font-size: 10px; font-weight: 500; }
    
    .notice-bar { background: rgba(255, 26, 26, 0.15); border: 1px dashed #ff3333; border-radius: 12px; padding: 8px 12px; font-size: 10.5px; color: #ffcccc; display: flex; align-items: center; gap: 8px; }
    
    .task-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .task-card { background: linear-gradient(180deg, #360707 0%, #150202 100%); border: 1.5px solid #ff2a2a; border-radius: 16px; padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; transition: all 0.25s ease; }
    .task-card:hover { transform: translateY(-2px); border-color: #ff6666; }
    
    .task-thumb { width: 66px; height: 52px; border-radius: 10px; background: #5c0f0f; border: 1px solid #ff4d4d; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .play-circle { width: 20px; height: 20px; background: rgba(255, 26, 26, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 8.5px; }
    .timestamp { position: absolute; bottom: 2px; right: 3px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 8px; font-weight: 700; padding: 1px 3px; border-radius: 3px; }
    
    .task-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2.5px; }
    .task-name { color: #ffffff; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-reward { display: flex; align-items: center; gap: 5px; }
    .mini-usd-tag { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 6px; }
    .reward-amount { color: #34d399; font-size: 11.5px; font-weight: 850; }
    
    .task-tags { display: flex; gap: 3.5px; margin-top: 1px; flex-wrap: wrap; }
    .tag { background: rgba(255, 26, 26, 0.2); border: 0.5px solid #ff4d4d; color: #ffb3b3; font-size: 8px; padding: 1.5px 5px; border-radius: 4px; font-weight: 600; }
    
    .btn-3d { background: linear-gradient(180deg, #ff4d4d 0%, #cc0000 100%); border: 1px solid #ff9999; color: white; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 14px; display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .no-tasks-state { text-align: center; color: #ff9999; padding: 40px 10px; font-size: 12px; font-weight: 600; line-height: 1.5; }
    .no-tasks-state i { font-size: 32px; color: #ff4d4d; margin-bottom: 8px; display: block; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10, 0, 0, 0.88); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
    .modal-box { width: 100%; max-width: 390px; background: radial-gradient(circle at 50% 0%, #4a0505 0%, #1f0303 70%, #0a0000 100%); border: 1.5px solid #ff2a2a; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 15px; right: 16px; color: #ff9999; font-size: 18px; cursor: pointer; }
    .modal-title { color: #fff; font-size: 15px; font-weight: 700; }
    
    .step-box { background: rgba(60, 5, 5, 0.5); border: 1px solid #991a1a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .step-header { color: #ff8080; font-size: 11px; font-weight: 700; }
    
    .video-link-btn { display: flex; align-items: center; justify-content: center; gap: 7px; background: linear-gradient(180deg, #ff0000 0%, #b30000 100%); color: white; padding: 11px; border-radius: 12px; font-size: 12.5px; font-weight: 800; border: none; cursor: pointer; }
    
    /* প্রোফাইল লিংক ইনপুট বক্স */
    .profile-input-box { background: rgba(30, 0, 0, 0.6); border: 1px solid #ff4d4d; border-radius: 10px; padding: 9px 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
    .profile-input-box label { font-size: 10.5px; color: #ffcccc; font-weight: 700; }
    .profile-input-box input { background: #120202; border: 1px solid #ff6666; border-radius: 7px; padding: 7px 10px; color: #ffffff; font-size: 11.5px; outline: none; }
    .profile-input-box small { font-size: 8.5px; color: #ff9999; }

    .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-top: 4px; }
    .upload-slot { border: 1.5px dashed #ff4d4d; background: rgba(80, 10, 10, 0.3); border-radius: 10px; height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
    .upload-slot i { font-size: 18px; color: #ff6666; margin-bottom: 3px; }
    .upload-slot span { color: #ffcccc; font-size: 9.5px; font-weight: 600; text-align: center; }
    .slot-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 5; }
    .slot-native-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
    
    .submit-btn { background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%); border: 1px solid #ff9999; color: white; font-size: 13px; font-weight: 700; padding: 11px; border-radius: 18px; cursor: pointer; width: 100%; text-align: center; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='index.html'" title="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </div>
      <div class="logo-3d"><i class="fa-brands fa-youtube"></i></div>
      <div class="header-title"><h2>YouTube Tasks</h2><p>Watch Video • Earn USD ($)</p></div>
    </div>
    
    <div class="notice-bar">
      <i class="fa-solid fa-circle-info"></i>
      <span>Follow Admin task rules. Upload required screenshots & profile link.</span>
    </div>
    
    <div class="task-list" id="taskListContainer"></div>
  </div>

  <!-- TASK MODAL -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <i class="fa-solid fa-xmark close-btn" onclick="closeModal()"></i>
      <h3 class="modal-title" id="m-title">Complete Task & Submit</h3>
      
      <!-- Step 1: Open Video -->
      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-1"></i> Step 1: Open Video in YouTube App</div>
        <button type="button" class="video-link-btn" onclick="openTargetNativeApp()">
          <i class="fa-brands fa-youtube"></i> Open in YouTube App
        </button>
      </div>

      <!-- Step 2: Dynamic Requirements from Admin -->
      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-2"></i> Step 2: Upload Required Proofs</div>
        
        <!-- ডুপ্লিকেট সাবস্ক্রাইব রোধে প্রোফাইল লিংক ইনপুট -->
        <div id="profileLinkBox" class="profile-input-box" style="display:none;">
          <label><i class="fa-solid fa-link"></i> আপনার ইউটিউব চ্যানেল / প্রোফাইল লিংক দিন:</label>
          <input type="url" id="userProfileUrl" placeholder="https://youtube.com/@yourchannel">
          <small>⚠️ এই প্রোফাইল দিয়ে পূর্বে কাজ করা হয়েছে কি না তা স্বয়ংক্রিয়ভাবে যাচাই করা হবে।</small>
        </div>

        <!-- অ্যাডমিন রুলস অনুযায়ী শুধু প্রয়োজনীয় স্ক্রিনশট স্লট আসবে -->
        <div class="upload-grid" id="dynamicUploadGrid"></div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitProof()">
        <i class="fa-solid fa-circle-check"></i> Submit for Review
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrG81DRVjx040QhiT68yyRErGXjuCPdS4",
      authDomain: "micro-task-2906d.firebaseapp.com",
      projectId: "micro-task-2906d",
      storageBucket: "micro-task-2906d.firebasestorage.app",
      messagingSenderId: "642332420854",
      appId: "1:642332420854:web:67115930992e7685b49ad7",
      measurementId: "G-N76WH82XYJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let activeTaskId = null;
    let activeTaskUrl = '';
    let activeRewardUSD = 0.20;
    let activeTaskData = null;

    // অলরেডি সাবমিট করা টাস্কের লিস্ট (যাতে পেন্ডিং না দেখিয়ে স্ক্রিন থেকে চিরতরে গায়েব হয়ে যায়)
    let userSubmittedTasks = new Set(JSON.parse(localStorage.getItem('yt_submitted_tasks') || '[]'));

    function getUserUID() {
      const cached = JSON.parse(localStorage.getItem('microtask_cached_user')) || {};
      return String(cached.uid || (auth.currentUser ? auth.currentUser.uid : '000000')).trim();
    }

    // ফায়ারবেস থেকে লাইভ টাস্ক লোড
    function listenToLiveTasks() {
      const myUID = getUserUID();

      // ইউজারের পূর্বের সাবমিট করা কাজগুলো টেনে আনা
      db.collection("task_submissions").where("uid", "==", myUID).get().then(snap => {
        snap.forEach(doc => {
          if (doc.data().taskId) userSubmittedTasks.add(doc.data().taskId);
        });
        localStorage.setItem('yt_submitted_tasks', JSON.stringify([...userSubmittedTasks]));
      }).catch(() => {});

      db.collection("tasks").where("platform", "==", "youtube").onSnapshot(snapshot => {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = '';

        let visibleCount = 0;

        snapshot.forEach(doc => {
          const tId = doc.id;
          // কাজ সাবমিট করা হয়ে গেলে তা আর এই পেজে দেখাবে না (মুছে যাবে)
          if (userSubmittedTasks.has(tId)) return;

          const data = doc.data();
          const reward = data.rewardUSD || (data.coins ? (data.coins / 100) : 0.20);
          renderSingleTaskCard(tId, data.title || 'YouTube Task', reward, data.duration || '2:00', data.url, data);
          visibleCount++;
        });

        if (visibleCount === 0) {
          container.innerHTML = `
            <div class="no-tasks-state">
              <i class="fa-solid fa-circle-check"></i>
              <p>সবগুলো টাস্ক সম্পন্ন হয়েছে!<br>নতুন টাস্ক আসলে এখানে দেখতে পাবেন।</p>
            </div>
          `;
        }
      });
    }

    // অ্যাডমিন যে রুলস দেবে শুধু সেই ট্যাগ শো করবে
    function renderSingleTaskCard(id, title, rewardUSD, duration, url, taskData) {
      const container = document.getElementById('taskListContainer');

      // অ্যাডমিন রুলস ট্যাগ
      let tagsHtml = '';
      if (taskData.requiresLike !== false) tagsHtml += `<span class="tag">Like</span>`;
      if (taskData.requiresSubscribe === true) tagsHtml += `<span class="tag">Subscribe</span>`;
      if (taskData.requiresComment === true) tagsHtml += `<span class="tag">Comment</span>`;
      if (!tagsHtml) tagsHtml = `<span class="tag">Like</span>`;

      const card = document.createElement('div');
      card.className = `task-card`;
      card.id = `card-${id}`;
      card.onclick = () => handleCardClick(id, title, rewardUSD, url, taskData);

      card.innerHTML = `
        <div class="task-thumb">
          <div class="play-circle"><i class="fa-solid fa-play"></i></div>
          <span class="timestamp">${duration}</span>
        </div>
        <div class="task-info">
          <span class="task-name">${title}</span>
          <div class="task-reward">
            <span class="mini-usd-tag">USD</span>
            <span class="reward-amount">+$${parseFloat(rewardUSD).toFixed(2)}</span>
          </div>
          <div class="task-tags">${tagsHtml}</div>
        </div>
        <div class="action-btn-area">
          <button class="btn-3d"><i class="fa-solid fa-play"></i> Start</button>
        </div>
      `;

      container.appendChild(card);
    }

    // মডাল ওপেন এবং অ্যাডমিনের রুলস অনুযায়ী ইনপুট সাজানো
    function handleCardClick(id, title, rewardUSD, url, taskData) {
      activeTaskId = id;
      activeTaskUrl = url || 'https://www.youtube.com';
      activeRewardUSD = parseFloat(rewardUSD) || 0.20;
      activeTaskData = taskData || {};

      document.getElementById('m-title').innerText = `${title} (+$${activeRewardUSD.toFixed(2)})`;

      const uploadGrid = document.getElementById('dynamicUploadGrid');
      const profileLinkBox = document.getElementById('profileLinkBox');
      uploadGrid.innerHTML = '';

      // ১. যদি Subscribe/Follow করতে বলা হয় -> প্রোফাইল লিংক ইনপুট দেখাবে
      if (activeTaskData.requiresSubscribe === true) {
        profileLinkBox.style.display = 'flex';
        document.getElementById('userProfileUrl').value = '';
      } else {
        profileLinkBox.style.display = 'none';
      }

      // ২. অ্যাডমিনের চাওয়া অনুযায়ী ডায়নামিক স্ক্রিনশট আপলোড স্লট তৈরি
      let slotIndex = 1;

      // লাইক স্লট
      if (activeTaskData.requiresLike !== false) {
        uploadGrid.innerHTML += createUploadSlotHTML(slotIndex, 'Like', 'fa-thumbs-up');
        slotIndex++;
      }

      // সাবস্ক্রাইব স্লট
      if (activeTaskData.requiresSubscribe === true) {
        uploadGrid.innerHTML += createUploadSlotHTML(slotIndex, 'Subscribe', 'fa-bell');
        slotIndex++;
      }

      // কমেন্ট স্লট
      if (activeTaskData.requiresComment === true) {
        uploadGrid.innerHTML += createUploadSlotHTML(slotIndex, 'Comment', 'fa-comment-dots');
        slotIndex++;
      }

      document.getElementById('taskModal').style.display = "flex";
    }

    function createUploadSlotHTML(index, label, iconClass) {
      return `
        <div class="upload-slot">
          <i class="fa-solid ${iconClass}"></i>
          <span>${label}</span>
          <img id="prev-${index}" class="slot-preview">
          <input type="file" id="file-${index}" accept="image/*" class="slot-native-input" onchange="previewSlot(${index}, event)">
        </div>
      `;
    }

    function openTargetNativeApp() {
      if (!activeTaskUrl) return;
      let target = activeTaskUrl.trim();
      if (!/^https?:\/\//i.test(target)) target = 'https://' + target;

      const a = document.createElement('a');
      a.href = target;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function previewSlot(num, e){
      if(e.target.files && e.target.files[0]){
        let r = new FileReader();
        r.onload = function(ev){ 
          document.getElementById('prev-'+num).src = ev.target.result; 
          document.getElementById('prev-'+num).style.display = "block"; 
        };
        r.readAsDataURL(e.target.files[0]);
      }
    }

    function closeModal(){ document.getElementById('taskModal').style.display="none"; }

    // ================= ৩. সাবমিশন এবং ডুপ্লিকেট প্রোফাইল লিংক ভেরিফিকেশন =================
    async function submitProof() {
      const btn = document.getElementById('submitBtn');
      const inputs = document.querySelectorAll('.slot-native-input');

      // সব কয়টি প্রয়োজনীয় স্ক্রিনশট আপলোড হয়েছে কি না চেক
      for (let input of inputs) {
        if (!input.files || input.files.length === 0) {
          alert("অ্যাডমিনের চাওয়া সব কয়টি স্ক্রিনশট সিলেক্ট করুন!");
          return;
        }
      }

      let profileUrl = '';

      // সাবস্ক্রাইব টাস্ক হলে প্রোফাইল লিংক ডুপ্লিকেট চেক
      if (activeTaskData && activeTaskData.requiresSubscribe === true) {
        profileUrl = document.getElementById('userProfileUrl').value.trim().toLowerCase().replace(/\/+$/, "");

        if (!profileUrl) {
          alert("অনুগ্রহ করে আপনার ইউটিউব প্রোফাইল / চ্যানেল লিংকটি প্রবেশ করান!");
          return;
        }

        btn.disabled = true;
        btn.innerText = "যাচাই করা হচ্ছে...";

        try {
          // ডাটাবেজে চেক করা এই প্রোফাইল দিয়ে আগে এই চ্যানেলে সাবস্ক্রাইব করা হয়েছে কি না
          const duplicateCheck = await db.collection("task_submissions")
            .where("taskId", "==", activeTaskId)
            .where("profileUrl", "==", profileUrl)
            .get();

          if (!duplicateCheck.empty) {
            alert("⚠️ এই প্রোফাইল লিংক দিয়ে ইতিপূর্বে এই টাস্কটি সম্পন্ন করা হয়েছে! একই প্রোফাইল একাধিকবার ব্যবহার করা সম্পূর্ণ নিষিদ্ধ।");
            btn.disabled = false;
            btn.innerText = "Submit for Review";
            return;
          }
        } catch (err) {
          console.log("Check err:", err);
        }
      }

      btn.disabled = true;
      btn.innerText = "Submitting to Admin...";

      const userUID = getUserUID();

      db.collection("task_submissions").add({
        taskId: activeTaskId,
        platform: "youtube",
        uid: userUID,
        profileUrl: profileUrl || null,
        rewardUSD: activeRewardUSD,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        // ১. কাজ সাবমিট হওয়া মাত্রই ইউজারের লোকাল লিস্টে যোগ
        userSubmittedTasks.add(activeTaskId);
        localStorage.setItem('yt_submitted_tasks', JSON.stringify([...userSubmittedTasks]));

        // ২. কার্ডটি স্ক্রিন থেকে সাথে সাথে মুছে ফেলা (আর পেন্ডিং দেখাবে না)
        const cardElem = document.getElementById(`card-${activeTaskId}`);
        if (cardElem) cardElem.remove();

        // যদি আর কোনো কাজ না থাকে
        const container = document.getElementById('taskListContainer');
        if (container.children.length === 0) {
          container.innerHTML = `
            <div class="no-tasks-state">
              <i class="fa-solid fa-circle-check"></i>
              <p>সবগুলো টাস্ক সম্পন্ন হয়েছে!<br>নতুন টাস্ক আসলে এখানে দেখতে পাবেন।</p>
            </div>
          `;
        }

        alert("টাস্কটি সফলভাবে জমা দেওয়া হয়েছে! অ্যাডমিন রিভিউয়ের পর ব্যালেন্স যোগ হবে।");
        closeModal();
      }).catch(err => {
        alert("ত্রুটি: " + err.message);
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Submit for Review";
      });
    }

    document.addEventListener('DOMContentLoaded', listenToLiveTasks);
  </script>
</body>
</html>
