<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Tasks — MicroTask</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: #080000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px 10px; }
    .app-screen { width: 100%; max-width: 410px; background: radial-gradient(circle at 50% 20%, #4a0505 0%, #1a0202 60%, #080000 100%); border: 2px solid #ff1a1a; border-radius: 28px; padding: 18px 14px; box-shadow: 0 0 25px rgba(255, 26, 26, 0.35); display: flex; flex-direction: column; gap: 14px; min-height: 600px; }
    
    /* Header */
    .header { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      color: #ff9999; font-size: 16px; cursor: pointer;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255, 26, 26, 0.15); border: 1px solid rgba(255, 77, 77, 0.35);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .back-btn:active { transform: scale(0.9); }

    .logo-3d { width: 40px; height: 40px; background: linear-gradient(145deg, #ff3333, #b30000); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; color: white; box-shadow: 0 4px 10px rgba(255, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
    .header-title h2 { color: #ffffff; font-size: 16px; font-weight: 700; }
    .header-title p { color: #ff8080; font-size: 10px; font-weight: 500; }
    
    .notice-bar { background: rgba(255, 26, 26, 0.15); border: 1px dashed #ff3333; border-radius: 12px; padding: 8px 12px; font-size: 10.5px; color: #ffcccc; display: flex; align-items: center; gap: 8px; }
    .notice-bar i { color: #ff4d4d; }
    
    /* Task List */
    .task-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .task-card { background: linear-gradient(180deg, #360707 0%, #150202 100%); border: 1.5px solid #ff2a2a; border-radius: 16px; padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; transition: 0.2s; }
    .task-card:hover { transform: translateY(-2px); border-color: #ff6666; }
    .task-card.is-pending { border-color: #e69500 !important; }
    
    .task-thumb { width: 66px; height: 52px; border-radius: 10px; background: #5c0f0f; border: 1px solid #ff4d4d; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .play-circle { width: 20px; height: 20px; background: rgba(255, 26, 26, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 8.5px; }
    .timestamp { position: absolute; bottom: 2px; right: 3px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 8px; font-weight: 700; padding: 1px 3px; border-radius: 3px; }
    
    .task-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2.5px; }
    .task-name { color: #ffffff; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* সরাসরি ডলার ($ USD) ডিসপ্লে */
    .task-reward { display: flex; align-items: center; gap: 5px; }
    .mini-usd-tag { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 6px; }
    .reward-amount { color: #34d399; font-size: 11.5px; font-weight: 850; }
    
    .task-tags { display: flex; gap: 3.5px; margin-top: 1px; }
    .tag { background: rgba(255, 26, 26, 0.2); border: 0.5px solid #ff4d4d; color: #ffb3b3; font-size: 8px; padding: 1.5px 4.5px; border-radius: 4px; font-weight: 600; }
    
    .btn-3d { background: linear-gradient(180deg, #ff4d4d 0%, #cc0000 100%); border: 1px solid #ff9999; color: white; font-size: 11px; font-weight: 700; padding: 6px 11px; border-radius: 14px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
    .btn-pending { background: linear-gradient(180deg, #ffb300 0%, #e67e00 100%); border: 1px solid #ffe082; color: #fff; font-size: 9.5px; font-weight: 700; padding: 5px 8px; border-radius: 12px; }

    .empty-tasks { text-align: center; padding: 40px 10px; color: #ff9999; font-size: 12px; display: none; }
    .empty-tasks i { font-size: 32px; color: #ff1a1a; margin-bottom: 8px; display: block; }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
    .modal-box { width: 100%; max-width: 390px; background: radial-gradient(circle at 50% 0%, #4a0505 0%, #1f0303 70%, #0a0000 100%); border: 1.5px solid #ff2a2a; border-radius: 22px; padding: 18px 16px; box-shadow: 0 0 25px rgba(255, 26, 26, 0.4); display: flex; flex-direction: column; gap: 12px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 16px; color: #ff9999; font-size: 18px; cursor: pointer; }
    .modal-title { color: #fff; font-size: 15px; font-weight: 700; }
    
    .step-box { background: rgba(60, 5, 5, 0.5); border: 1px solid #991a1a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .step-header { color: #ff8080; font-size: 10.5px; font-weight: 700; }
    
    /* ক্র্যাশ-মুক্ত ইউনিভার্সাল ওপেন বাটন */
    .video-link-btn { display: flex; align-items: center; justify-content: center; gap: 7px; background: linear-gradient(180deg, #ff0000 0%, #b30000 100%); color: white; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 0, 0, 0.35); }
    .video-link-btn:active { transform: scale(0.97); }
    
    /* সরাসরি গ্যালারি ওপেন স্লট */
    .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .upload-slot { border: 1.5px dashed #ff4d4d; background: rgba(80, 10, 10, 0.3); border-radius: 10px; height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
    .upload-slot i { font-size: 18px; color: #ff6666; margin-bottom: 3px; }
    .upload-slot span { color: #ffcccc; font-size: 9.5px; font-weight: 600; text-align: center; }
    .slot-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 5; }
    
    /* স্বচ্ছ ইনপুট যা স্লটে টাচ করলেই ফোনের গ্যালারি খুলে দেবে */
    .slot-native-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
    
    .submit-btn { background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%); border: 1px solid #ff9999; color: white; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 18px; cursor: pointer; width: 100%; text-align: center; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app-screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='index.html'" title="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </div>
      <div class="logo-3d"><i class="fa-brands fa-youtube"></i></div>
      <div class="header-title"><h2>YouTube Tasks</h2><p>Watch Video • Subscribe • Earn USD ($)</p></div>
    </div>
    
    <div class="notice-bar">
      <i class="fa-solid fa-circle-info"></i>
      <span>Tap slots to select screenshots directly from your gallery.</span>
    </div>
    
    <div class="task-list" id="taskListContainer">
      <div class="empty-tasks" id="emptyTasksMsg">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>No YouTube tasks available right now.<br>Check back later!</span>
      </div>
    </div>
  </div>

  <!-- প্রুফ সাবমিট মডাল -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <i class="fa-solid fa-xmark close-btn" onclick="closeModal()"></i>
      <h3 class="modal-title" id="m-title">Complete Task & Submit</h3>
      
      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-1"></i> Step 1: Open Video</div>
        <!-- ক্র্যাশ-মুক্ত লিঙ্ক ওপেন বাটন -->
        <button type="button" class="video-link-btn" onclick="openTargetVideo()">
          <i class="fa-brands fa-youtube"></i> Open Video Link
        </button>
      </div>

      <div class="step-box">
        <div class="step-header"><i class="fa-solid fa-2"></i> Step 2: Select 3 Screenshots from Gallery</div>
        <div class="upload-grid">
          <!-- ১. লাইক স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-thumbs-up"></i><span>1. Like</span>
            <img id="prev-1" class="slot-preview">
            <input type="file" id="file-1" accept="image/*" class="slot-native-input" onchange="previewSlot(1, event)">
          </div>
          
          <!-- ২. সাবস্ক্রাইব স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-bell"></i><span>2. Subscribe</span>
            <img id="prev-2" class="slot-preview">
            <input type="file" id="file-2" accept="image/*" class="slot-native-input" onchange="previewSlot(2, event)">
          </div>
          
          <!-- ৩. কমেন্ট স্লট -->
          <div class="upload-slot">
            <i class="fa-solid fa-comment-dots"></i><span>3. Comment</span>
            <img id="prev-3" class="slot-preview">
            <input type="file" id="file-3" accept="image/*" class="slot-native-input" onchange="previewSlot(3, event)">
          </div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitProof()">
        <i class="fa-solid fa-circle-check"></i> Submit for Admin Review
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrG81DRVjx040QhiT68yyRErGXjuCPdS4",
      authDomain: "micro-task-2906d.firebaseapp.com",
      projectId: "micro-task-2906d",
      storageBucket: "micro-task-2906d.firebasestorage.app",
      messagingSenderId: "642332420854",
      appId: "1:642332420854:web:67115930992e7685b49ad7",
      measurementId: "G-N76WH82XYJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let activeTaskId = null;
    let activeTaskUrl = '';
    let activeRewardUSD = 0.20;
    let pendingTasks = new Set(JSON.parse(localStorage.getItem('yt_pending_tasks') || '[]'));

    // ডিফল্ট ডেমো টাস্ক (ডলারে ডিসপ্লে)
    const DEFAULT_YT_TASKS = [
      { id: 'yt-1', title: 'Official Music Video #1', rewardUSD: 0.25, duration: '3:45', url: 'https://youtube.com' },
      { id: 'yt-2', title: 'Trending Shorts Episode #2', rewardUSD: 0.15, duration: '0:59', url: 'https://youtube.com' }
    ];

    function listenToLiveTasks() {
      db.collection("tasks").where("platform", "==", "youtube").onSnapshot(snapshot => {
        const container = document.getElementById('taskListContainer');
        const emptyMsg = document.getElementById('emptyTasksMsg');
        container.querySelectorAll('.task-card').forEach(c => c.remove());

        if (snapshot.empty) {
          renderTasksArray(DEFAULT_YT_TASKS);
        } else {
          emptyMsg.style.display = 'none';
          snapshot.forEach(doc => {
            const data = doc.data();
            const reward = data.rewardUSD || (data.coins ? (data.coins / 100) : 0.20);
            renderSingleTaskCard(doc.id, data.title, reward, data.duration || '2:00', data.url || 'https://youtube.com');
          });
        }
      }, err => {
        renderTasksArray(DEFAULT_YT_TASKS);
      });
    }

    function renderTasksArray(array) {
      array.forEach(t => renderSingleTaskCard(t.id, t.title, t.rewardUSD || 0.20, t.duration, t.url));
    }

    function renderSingleTaskCard(id, title, rewardUSD, duration, url) {
      const container = document.getElementById('taskListContainer');
      const isPending = pendingTasks.has(id);

      const card = document.createElement('div');
      card.className = `task-card ${isPending ? 'is-pending' : ''}`;
      card.id = id;
      card.onclick = () => handleCardClick(id, title, rewardUSD, url);

      card.innerHTML = `
        <div class="task-thumb">
          <div class="play-circle"><i class="fa-solid fa-play"></i></div>
          <span class="timestamp">${duration}</span>
        </div>
        <div class="task-info">
          <span class="task-name">${title}</span>
          <div class="task-reward">
            <span class="mini-usd-tag">USD</span>
            <span class="reward-amount">+$${parseFloat(rewardUSD).toFixed(2)}</span>
          </div>
          <div class="task-tags">
            <span class="tag">Like</span>
            <span class="tag">Subscribe</span>
            <span class="tag">Comment</span>
          </div>
        </div>
        <div class="action-btn-area">
          ${isPending 
            ? '<div class="btn-pending"><i class="fa-solid fa-clock"></i> Pending</div>' 
            : '<button class="btn-3d"><i class="fa-solid fa-play"></i> Start</button>'}
        </div>
      `;

      container.appendChild(card);
    }

    function handleCardClick(id, title, rewardUSD, url) {
      if(pendingTasks.has(id)) { alert("This task is currently Pending Admin review!"); return; }
      activeTaskId = id;
      activeTaskUrl = url || 'https://youtube.com';
      activeRewardUSD = parseFloat(rewardUSD) || 0.20;

      document.getElementById('m-title').innerText = `${title} (+$${activeRewardUSD.toFixed(2)})`;
      
      for(let i=1; i<=3; i++){ 
        document.getElementById('file-'+i).value = ""; 
        document.getElementById('prev-'+i).style.display = "none"; 
      }
      document.getElementById('taskModal').style.display = "flex";
    }

    // ১০০% ক্র্যাশ-মুক্ত লিঙ্ক ওপেনার (ERR_UNKNOWN_URL_SCHEME আসবে না)
    function openTargetVideo() {
      if (!activeTaskUrl) return;
      const win = window.open(activeTaskUrl, '_blank');
      if (!win) {
        window.location.href = activeTaskUrl;
      }
    }

    // গ্যালারি প্রিভিউ হ্যান্ডলার
    function previewSlot(num, e){
      if(e.target.files && e.target.files[0]){
        let r = new FileReader();
        r.onload = function(ev){ 
          document.getElementById('prev-'+num).src = ev.target.result; 
          document.getElementById('prev-'+num).style.display = "block"; 
        };
        r.readAsDataURL(e.target.files[0]);
      }
    }

    function closeModal(){ document.getElementById('taskModal').style.display = "none"; }

    function submitProof(){
      if(!document.getElementById('file-1').files.length || !document.getElementById('file-2').files.length || !document.getElementById('file-3').files.length){
        alert("Please select all 3 screenshots from your gallery!"); return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Submitting to Admin...";
      
      pendingTasks.add(activeTaskId);
      localStorage.setItem('yt_pending_tasks', JSON.stringify([...pendingTasks]));
      
      let card = document.getElementById(activeTaskId);
      if(card) {
        card.classList.add('is-pending');
        card.querySelector('.action-btn-area').innerHTML = '<div class="btn-pending"><i class="fa-solid fa-clock"></i> Pending</div>';
      }

      // ড্যাশবোর্ডের ৬ সংখ্যার আসল ইউআইডি নেওয়া
      const cachedUser = JSON.parse(localStorage.getItem('microtask_cached_user')) || {};
      const userUID = String(cachedUser.uid || '000000').trim();

      db.collection("task_submissions").add({
        taskId: activeTaskId,
        platform: "youtube",
        uid: userUID,
        rewardUSD: activeRewardUSD,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Proof submitted successfully! It is now Pending review in the Admin Panel.");
        closeModal();
      }).catch(err => {
        alert("Submission error: " + err.message);
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Submit for Admin Review";
      });
    }

    document.addEventListener('DOMContentLoaded', listenToLiveTasks);
  </script>
</body>
</html>
