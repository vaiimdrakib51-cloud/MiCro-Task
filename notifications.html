<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Notifications — MicroTask</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f9ff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 10px 8px 24px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 22px;
      padding: 14px 12px;
      box-shadow: 0 6px 25px rgba(2, 132, 199, 0.08);
      border: 1.5px solid #d4ebf8;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    /* হেডার */
    .header {
      margin-bottom: 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #0284c7;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .back-btn:active { transform: scale(0.92); }

    .title-row .bell-icon {
      font-size: 18px;
      color: #f59e0b;
    }

    .title-row h1 {
      font-size: 18px;
      font-weight: 850;
      color: #0f172a;
    }

    .badge-count {
      background-color: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .subtitle {
      color: #64748b;
      font-size: 11px;
      margin-left: 42px;
    }

    /* ফিল্টার বাটনস */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.2);
    }

    /* সরু ও কমপ্যাক্ট নোটিফিকেশন কার্ড লিস্ট */
    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }

    .notif-card {
      position: relative;
      background: #ffffff;
      border: 1.2px solid #e2e8f0;
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .notif-card:active { transform: scale(0.99); }
    .notif-card:hover { border-color: #bae6fd; }

    .notif-card.unread {
      background: #f0f9ff;
      border-color: #bae6fd;
    }

    /* বামদিকের ওপরের কোনায় ব্র্যান্ড লোগো বক্স */
    .brand-logo-box {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      background: #ffffff;
      border: 1.2px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      padding: 2.5px;
      margin-top: 1px;
    }
    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-logo-box i {
      font-size: 15px;
      color: #ffffff;
    }

    .card-content { 
      flex: 1; 
      min-width: 0; 
      line-height: 1.2;
    }

    .card-header-line {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      font-size: 8px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 5px;
      text-transform: capitalize;
    }

    .tag-earnings { background: #dcfce7; color: #15803d; }
    .tag-support { background: #ccfbf1; color: #0f766e; }
    .tag-referral { background: #f3e8ff; color: #7e22ce; }
    .tag-system { background: #ffedd5; color: #c2410c; }

    .card-desc {
      font-size: 10.5px;
      color: #475569;
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .card-time {
      font-size: 9px;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
    }

    .card-actions-right {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .notif-del-btn {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .notif-del-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .card-arrow {
      color: #94a3b8;
      font-size: 9px;
    }

    .unread-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    .empty-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 50px 10px;
      color: #94a3b8;
      text-align: center;
    }
    .empty-msg i { font-size: 32px; margin-bottom: 8px; color: #cbd5e1; }
    .empty-msg p { font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- হেডার -->
    <div class="header">
      <div class="title-row">
        <button type="button" class="back-btn" onclick="window.location.href='index.html'" title="Back to Dashboard">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <i class="fa-solid fa-bell bell-icon"></i>
        <h1>Notifications</h1>
        <span class="badge-count" id="badgeCount">0</span>
      </div>
      <p class="subtitle">System, Support, Referral & Earnings updates</p>
    </div>

    <!-- ক্যাটাগরি ফিল্টার -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="system"><i class="fa-solid fa-bullhorn"></i> System</button>
      <button class="filter-btn" data-filter="support"><i class="fa-solid fa-headset"></i> Support</button>
      <button class="filter-btn" data-filter="referral"><i class="fa-solid fa-user-group"></i> Referral</button>
      <button class="filter-btn" data-filter="earnings"><i class="fa-solid fa-wallet"></i> Earnings</button>
    </div>

    <!-- নোটিফিকেশন লিস্ট -->
    <div class="notification-list" id="notificationList"></div>

    <!-- কোনো নোটিফিকেশন না থাকলে দেখাবে -->
    <div class="empty-msg" id="emptyMsg">
      <i class="fa-regular fa-bell-slash"></i>
      <p>No notifications found</p>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBrG81DRVjx040QhiT68yyRErGXjuCPdS4",
      authDomain: "micro-task-2906d.firebaseapp.com",
      projectId: "micro-task-2906d",
      storageBucket: "micro-task-2906d.firebasestorage.app",
      messagingSenderId: "642332420854",
      appId: "1:642332420854:web:67115930992e7685b49ad7",
      measurementId: "G-N76WH82XYJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const filterButtons = document.querySelectorAll('.filter-btn');
    const badgeCount = document.getElementById('badgeCount');
    const emptyMsg = document.getElementById('emptyMsg');
    const notifContainer = document.getElementById('notificationList');

    let allNotifs = [];
    let currentFilter = 'all';
    let userSignupTime = 0;

    function getReadIds() {
      try { return JSON.parse(localStorage.getItem('read_notif_ids') || '[]'); } catch(e) { return []; }
    }

    function getDeletedIds() {
      try { return JSON.parse(localStorage.getItem('deleted_notif_ids') || '[]'); } catch(e) { return []; }
    }

    function formatTimeAgo(createdAt) {
      if (!createdAt) return 'Just now';

      let millis = 0;
      if (createdAt.toMillis) {
        millis = createdAt.toMillis();
      } else if (createdAt.seconds) {
        millis = createdAt.seconds * 1000;
      } else if (createdAt instanceof Date) {
        millis = createdAt.getTime();
      } else {
        millis = new Date(createdAt).getTime();
      }

      if (isNaN(millis) || millis <= 0) return 'Just now';

      const diffSec = Math.floor((Date.now() - millis) / 1000);

      if (diffSec < 60) return 'Just now';
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
      
      const days = Math.floor(diffSec / 86400);
      if (days === 1) return 'Yesterday';
      if (days < 7) return `${days}d ago`;

      return new Date(millis).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    // সেক্টর অনুযায়ী আসল ব্র্যান্ড লোগো
    function getNotificationLogoMeta(n) {
      const title = (n.title || '').toLowerCase();
      const msg = (n.message || '').toLowerCase();
      const cat = (n.category || '').toLowerCase();
      const method = (n.method || '').toLowerCase();
      const platform = (n.platform || '').toLowerCase();

      // নগদ
      if (method.includes('nagad') || title.includes('nagad') || msg.includes('nagad') || title.includes('নগদ') || msg.includes('নগদ')) {
        return {
          html: `<img src="https://i.ibb.co.com/gZSnQ6Xb/nagad-com-bd-logo.png" alt="Nagad">`,
          borderColor: '#ff4d4d',
          tagText: 'Nagad',
          tagClass: 'tag-earnings'
        };
      }

      // বিকাশ
      if (method.includes('bkash') || title.includes('bkash') || msg.includes('bkash') || title.includes('বিকাশ') || msg.includes('বিকাশ')) {
        return {
          html: `<img src="https://i.ibb.co.com/fzcrRGrf/bkash-com-logo.png" alt="bKash">`,
          borderColor: '#e2136e',
          tagText: 'bKash',
          tagClass: 'tag-earnings'
        };
      }

      // বাইনান্স
      if (method.includes('binance') || title.includes('binance') || msg.includes('binance') || title.includes('বাইনান্স') || msg.includes('বাইনান্স')) {
        return {
          html: `<img src="https://cryptologos.cc/logos/bnb-bnb-logo.png" alt="Binance" style="padding:1px;">`,
          borderColor: '#f59e0b',
          tagText: 'Binance',
          tagClass: 'tag-earnings'
        };
      }

      // বুস্ট
      if (platform.includes('boost') || title.includes('boost') || msg.includes('boost') || title.includes('বুস্ট')) {
        return {
          html: `<img src="https://i.ibb.co.com/S71wYZrD/capital-gain.png" alt="Boost">`,
          borderColor: '#f59e0b',
          tagText: 'Boost',
          tagClass: 'tag-earnings'
        };
      }

      // সাপোর্ট
      if (cat === 'support' || title.includes('support') || title.includes('সাপোর্ট')) {
        return {
          html: `<img src="https://i.ibb.co.com/DHMB6J4S/file-00000000a6888211aa5b662731e1ff68.png" alt="Support">`,
          borderColor: '#0284c7',
          tagText: 'Support',
          tagClass: 'tag-support'
        };
      }

      // রেফারেল
      if (cat === 'referral' || title.includes('refer') || title.includes('রেফার')) {
        return {
          html: `<img src="https://i.ibb.co.com/v4VRDgYQ/IMG-20261015-172656-563.png" alt="Referral">`,
          borderColor: '#8b5cf6',
          tagText: 'Referral',
          tagClass: 'tag-referral'
        };
      }

      // ওয়ালেট / আর্নিংস
      if (cat === 'earnings' || cat === 'deposit' || cat === 'withdraw' || title.includes('deposit') || title.includes('withdraw') || title.includes('ডিপোজিট') || title.includes('উইথড্র') || title.includes('বোনাস')) {
        return {
          html: `<img src="https://i.ibb.co.com/CpmVs7PB/wallet.png" alt="Wallet">`,
          borderColor: '#10b981',
          tagText: 'Earnings',
          tagClass: 'tag-earnings'
        };
      }

      // সিস্টেম নোটিশ
      return {
        html: `<img src="https://i.ibb.co.com/5W2f2xg4/pngtree-money-icon-dollar-coins-cash-payment-online-earning-png-image-7589413.png" alt="MicroTask">`,
        borderColor: '#0284c7',
        tagText: 'System',
        tagClass: 'tag-system'
      };
    }

    function renderNotifications() {
      const readIds = getReadIds();
      const deletedIds = getDeletedIds();
      
      const cachedUser = JSON.parse(localStorage.getItem('microtask_cached_user')) || {};
      const myUID = String(cachedUser.uid || '').trim();

      const filtered = allNotifs.filter(n => {
          if (deletedIds.includes(n.id)) return false;

          let notifCat = (n.category || 'system').toLowerCase();
          if (notifCat === 'deposit' || notifCat === 'withdraw') {
            notifCat = 'earnings';
          }

          const target = String(n.targetUid || '').trim();
          const isPersonal = target !== '' && (target === myUID || (auth.currentUser && target === auth.currentUser.uid));
          const isGlobalSystem = (!n.targetUid || target === 'all');

          // নতুন রেজিস্ট্রেশন করার পূর্বের গ্লোবাল নোটিশ বাদ দেওয়া
          let isTimeValid = true;
          if (isGlobalSystem && userSignupTime > 0 && n.createdAt) {
              const notifTime = n.createdAt.toMillis ? n.createdAt.toMillis() : new Date(n.createdAt).getTime();
              if (notifTime < userSignupTime) isTimeValid = false;
          }

          const isAllowedForMe = isPersonal || (isGlobalSystem && isTimeValid);
          const isMatchingTab = currentFilter === 'all' || notifCat === currentFilter;

          return isAllowedForMe && isMatchingTab;
      });

      if (filtered.length > 0) {
        badgeCount.textContent = filtered.length;
        badgeCount.style.display = 'flex';
      } else {
        badgeCount.style.display = 'none';
      }

      if (filtered.length === 0) {
        notifContainer.innerHTML = '';
        emptyMsg.style.display = 'flex';
      } else {
        emptyMsg.style.display = 'none';
        notifContainer.innerHTML = filtered.map(n => {
          let cat = (n.category || 'system').toLowerCase();
          if (cat === 'deposit' || cat === 'withdraw') cat = 'earnings';
          
          const visual = getNotificationLogoMeta(n);
          const isUnread = !readIds.includes(n.id);
          const targetUrl = n.actionUrl || '';
          const timeText = formatTimeAgo(n.createdAt);

          return `
            <div class="notif-card ${isUnread ? 'unread' : ''}" data-category="${cat}" onclick="handleNotificationClick('${n.id}', '${targetUrl}', '${cat}')">
              <div class="brand-logo-box" style="border-color: ${visual.borderColor};">
                ${visual.html}
              </div>
              <div class="card-content">
                <div class="card-header-line">
                  <span class="card-title">${n.title || 'Notification'}</span>
                  <span class="tag ${visual.tagClass}">${visual.tagText}</span>
                </div>
                <div class="card-desc">${n.message || ''}</div>
                <div class="card-time"><i class="fa-regular fa-clock"></i> ${timeText}</div>
              </div>
              <div class="card-actions-right">
                <button type="button" class="notif-del-btn" onclick="deleteNotification(event, '${n.id}', '${n.targetUid || ''}')" title="Delete">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
                <i class="fa-solid fa-chevron-right card-arrow"></i>
              </div>
              ${isUnread ? '<div class="unread-dot"></div>' : ''}
            </div>
          `;
        }).join('');
      }
    }

    function handleNotificationClick(notifId, url, category) {
        const readIds = getReadIds();
        if (!readIds.includes(notifId)) {
            readIds.push(notifId);
            localStorage.setItem('read_notif_ids', JSON.stringify(readIds));
        }

        if (url && url !== '') {
            window.location.href = url;
        } else if (category === 'support') {
            window.location.href = 'support.html';
        } else if (category === 'earnings') {
            window.location.href = 'history.html';
        } else if (category === 'referral') {
            window.location.href = 'refer.html';
        } else if (category === 'system') {
            window.location.href = 'index.html';
        } else {
            window.location.href = 'index.html';
        }
    }

    function deleteNotification(event, notifId, targetUid) {
      event.stopPropagation();
      
      const deletedIds = getDeletedIds();
      if (!deletedIds.includes(notifId)) {
        deletedIds.push(notifId);
        localStorage.setItem('deleted_notif_ids', JSON.stringify(deletedIds));
      }

      const cachedUser = JSON.parse(localStorage.getItem('microtask_cached_user')) || {};
      const myUID = String(cachedUser.uid || '').trim();
      if (targetUid && (targetUid === myUID || (auth.currentUser && targetUid === auth.currentUser.uid))) {
        db.collection("notifications").doc(notifId).delete().catch(() => {});
      }

      renderNotifications();
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderNotifications();
      });
    });

    setInterval(() => {
      renderNotifications();
    }, 30000);

    // ফায়ারবেস লাইভ লিসেনার (ড্যাশবোর্ডের সাথে লাইভ সিঙ্ক)
    auth.onAuthStateChanged(user => {
      if (user) {
        db.collection("users").doc(user.uid).get().then(doc => {
          if (doc.exists && doc.data().createdAt) {
            userSignupTime = doc.data().createdAt.toMillis ? doc.data().createdAt.toMillis() : new Date(doc.data().createdAt).getTime();
          }
        });
      }

      db.collection("notifications").orderBy("createdAt", "desc").limit(60).onSnapshot(snapshot => {
        allNotifs = [];
        snapshot.forEach(doc => {
          allNotifs.push({ id: doc.id, ...doc.data() });
        });
        renderNotifications();
      }, () => {
        renderNotifications();
      });
    });
  </script>

</body>
</html>
